<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:300"

            //requirement
            document
                .querySelector('button')
                .addEventListener('click', this.handleClick.bind(this))

        }
        handleClick(){
            console.log("button clicked");
            console.log(this.server);
        }
    }
//bind is used to create a new function that, when called, has its this keyword set to the provided value.
//  In this example, we use bind to ensure that the handleClick method has the correct this context when it is called as an event handler for the button click event.
//  By binding this to the instance of the React class, we can access the server property correctly when the button is clicked.
    const app = new React()
</script>
</html>
