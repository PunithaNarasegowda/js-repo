<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
</body>
<script>
    //event propagation - it means from bottom to top (bubbling)
    document.querySelector('div').addEventListener('click', function(){
        console.log('div clicked');
    },false);
    //upper is bubbling
    //but in capturing its from top to bottom
    document.querySelector('button').addEventListener('click', function(){
        console.log('button clicked');
    },true);
    //upper is capturing
    //events spillover
/*
Event bubbling: Event propagates from child to parent.
Event capturing: Event propagates from parent to child.
Event delegation: Handling child events using a parent listener.
*/
    </script>
</html>
